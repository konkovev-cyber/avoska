<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" />
  
  <path d="M0 0 L300 250 M0 50 L300 300 M0 100 L300 350 M0 150 L300 400" stroke="#ffffff" stroke-opacity="0.05" stroke-width="10" />

  <!-- Logo part (Top) -->
  <g transform="translate(150, 110)">
    <!-- 5 Stars -->
    <text x="0" y="-70" font-family="Arial" font-size="18" fill="white" text-anchor="middle" letter-spacing="2">⭐⭐⭐⭐⭐</text>
    
    <!-- Lion icon abstraction -->
    <path d="M -25,-20 C -25,-40 -10,-50 0,-50 C 10,-50 25,-40 25,-20 C 25,-10 20,0 20,10 C 20,20 10,30 0,30 C -10,30 -20,20 -20,10 C -20,0 -25,-10 -25,-20 Z" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <path d="M -30,-20 A 40,40 0 0,0 -20,10 M 30,-20 A 40,40 0 0,1 20,10" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <path d="M -10,-20 L 0,-10 L 10,-20" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="-10" cy="-25" r="2" fill="#60a5fa"/>
    <circle cx="10" cy="-25" r="2" fill="#60a5fa"/>
    <path d="M -5,0 Q 0,5 5,0" fill="none" stroke="#60a5fa" stroke-width="3"/>

    <!-- Left Wreath -->
    <path d="M -40,30 C -70,10 -70,-40 -45,-60" fill="none" stroke="white" stroke-width="3"/>
    <!-- Right Wreath -->
    <path d="M 40,30 C 70,10 70,-40 45,-60" fill="none" stroke="white" stroke-width="3"/>
    
    <!-- Ribbon -->
    <path d="M-110,35 Q0,15 110,35 L110,60 Q0,40 -110,60 Z" fill="white" filter="url(#shadow)" />
    <path d="M-110,40 L-120,50 L-110,60 Z" fill="#cbd5e1" />
    <path d="M110,40 L120,50 L110,60 Z" fill="#cbd5e1" />
    
    <text x="0" y="52" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#1e3a8a" text-anchor="middle">ГОРЯЧИЙ КЛЮЧ LIFE</text>
  </g>
  
  <!-- Content -->
  <text x="150" y="210" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="white" text-anchor="middle">Жизнь города</text>
  <text x="150" y="240" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="white" text-anchor="middle">Горячий Ключ</text>
  
  <!-- Categories -->
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#93c5fd">
    <text x="35" y="290">🔅 новости города и края</text>
    <text x="35" y="325">🔅 товары и услуги</text>
    <text x="35" y="360">🔅 ваша реклама</text>
    <text x="35" y="395">🔅 жизнь Горячего Ключа</text>
  </g>

  <!-- CTA -->
  <g transform="translate(150, 450)">
      <rect x="-110" y="-25" width="220" height="50" rx="25" fill="url(#gold)" filter="url(#shadow)" />
      <text x="0" y="3" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#78350f" text-anchor="middle">Подписаться</text>
  </g>
</svg>
