<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#ffe0b2" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="50%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" />
  
  <!-- Logo Circle -->
  <g transform="translate(150, 100)">
      <circle cx="0" cy="0" r="65" fill="url(#logoGrad)" filter="url(#shadow)" />
      <ellipse cx="0" cy="-35" rx="40" ry="18" fill="white" opacity="0.25" />
      <text x="0" y="-25" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="white" text-anchor="middle">мой</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-weight="900" font-size="58" fill="#111" text-anchor="middle" letter-spacing="-2">ГК</text>
  </g>
  
  <!-- Main Text -->
  <text x="150" y="200" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#111" text-anchor="middle">Мой Горячий</text>
  <text x="150" y="230" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#111" text-anchor="middle">Ключ</text>
  
  <!-- Bullets -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="600">
    <text x="20" y="275">🔶 Новости, происшествия</text>
    <text x="20" y="320">🔶 Пишите вопросы в директ!</text>
    <text x="45" y="340">Обсудим городом</text>
    <text x="20" y="380">🔶 Реклама товаров и услуг</text>
  </g>
  
  <!-- CTA / Admin -->
  <rect x="25" y="420" width="250" height="46" rx="23" fill="#22c55e" filter="url(#shadow)" />
  <text x="150" y="448" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="white" text-anchor="middle">Связаться с админом</text>
  
  <rect x="35" y="475" width="230" height="20" rx="10" fill="#f1f5f9" />
  <text x="150" y="489" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#475569" text-anchor="middle">По всем вопросам: Михаил</text>
</svg>
